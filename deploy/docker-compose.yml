services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paraglog
      POSTGRES_USER: paraglog
      POSTGRES_PASSWORD: paraglog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paraglog"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: src/ParagLog.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Database=paraglog;Username=paraglog;Password=paraglog"
      Accounts__PublicIdServerSalt: "paraglog-dev-salt-change-in-production"
      Storage__BlobsRoot: "/data/blobs"
    volumes:
      - blobs:/data/blobs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  viewer:
    build:
      context: ../viewer
    ports:
      - "8081:80"

  proxy:
    image: caddy:alpine
    depends_on:
      backend:
        condition: service_healthy
      viewer:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "80:80"

volumes:
  pgdata:
  blobs:
