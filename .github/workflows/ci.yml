name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: paraglog
          POSTGRES_USER: paraglog
          POSTGRES_PASSWORD: paraglog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paraglog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ParagLog.sln
        working-directory: backend

      - name: Build
        run: dotnet build ParagLog.sln --no-restore --configuration Release
        working-directory: backend

      - name: Test
        run: dotnet test ParagLog.sln --no-build --configuration Release
        working-directory: backend
        env:
          ConnectionStrings__Default: "Host=localhost;Database=paraglog;Username=paraglog;Password=paraglog"

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: viewer/package-lock.json

      - name: Install
        run: npm ci
        working-directory: viewer

      - name: Build
        run: npm run build
        working-directory: viewer

      - name: Test
        run: npm run test
        working-directory: viewer

  # Publishes backend and viewer images to GHCR on every push to dev - never on pull_request,
  # since forked-repo PRs don't get package-write permission on GITHUB_TOKEN.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [backend, viewer]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/src/ParagLog.Api/Dockerfile
          - image: viewer
            context: viewer
            dockerfile: viewer/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Compute image name
        id: image
        # GHCR image names must be lowercase; github.repository can carry uppercase (e.g. an
        # uppercase letter in the owner name).
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repo }}-${{ matrix.image }}:dev
            ghcr.io/${{ steps.image.outputs.repo }}-${{ matrix.image }}:${{ steps.version.outputs.value }}-dev
